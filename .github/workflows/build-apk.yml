name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Debug APK using Android command line
      run: |
        chmod +x gradlew || true
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          echo "No gradlew found, creating a basic build script or compiling..."
          javac --version
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
